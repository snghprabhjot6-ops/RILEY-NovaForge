[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riley-novaforge"
version = "0.2.0"
description = "Riley, a multilingual personal assistant by NovaForge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2"]

[project.scripts]
riley = "riley.cli:main"
riley-app = "riley.web:main"

[tool.setuptools.packages.find]
include = ["riley*"]

[tool.setuptools.package-data]
riley = ["static/*"]
