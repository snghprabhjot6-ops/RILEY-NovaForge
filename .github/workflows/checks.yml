name: Riley checks and Windows app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  windows-app:
    needs: [test, frontend]
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --name Riley --add-data "riley/static;riley/static" desktop.py
      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $rileyProcess = Start-Process -FilePath dist/Riley.exe -ArgumentList '--no-browser', '--port', '18765' -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $state = Invoke-RestMethod http://127.0.0.1:18765/api/state
                if ($state.token) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Packaged Riley did not start' }
            $page = Invoke-WebRequest http://127.0.0.1:18765/
            if ($page.Content -notmatch 'A clearer mind') { throw 'App assets missing' }
          } finally { Stop-Process -Id $rileyProcess.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: Riley-Windows
          path: dist/Riley.exe
